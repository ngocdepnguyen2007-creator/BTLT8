<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Câu 17 - Accordion</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .accordion-item { margin-bottom: 5px; width: 400px;}
        .accordion-header { background: #f4f4f4; padding: 12px; cursor: pointer; font-weight: bold; border: 1px solid #ddd; }
        .accordion-content { display: none; padding: 15px; border: 1px solid #ddd; border-top: none; }
    </style>
</head>
<body>
    <h3>Câu 17: Hiệu ứng Accordion</h3>
    
    <div class="accordion">
        <div class="accordion-item">
            <div class="accordion-header">Tiêu đề Nội dung 1</div>
            <div class="accordion-content" style="display: block;">Đây là nội dung của phần 1. Chỉ một nội dung được mở cùng lúc.</div>
        </div>
        <div class="accordion-item">
            <div class="accordion-header">Tiêu đề Nội dung 2</div>
            <div class="accordion-content">Đây là nội dung của phần 2. Khi bạn click vào đây, phần 1 sẽ tự động đóng lại.</div>
        </div>
        <div class="accordion-item">
            <div class="accordion-header">Tiêu đề Nội dung 3</div>
            <div class="accordion-content">Đây là nội dung của phần 3. Ứng dụng hàm slideUp và slideDown.</div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('.accordion-header').on('click', function() {
                // Đóng tất cả nội dung khác
                $('.accordion-content').slideUp();
                
                // Mở nội dung ngay dưới header được click nếu nó đang đóng
                let content = $(this).next('.accordion-content');
                if (!content.is(':visible')) {
                    content.slideDown();
                }
            });
        });
    </script>
</body>
</html>
